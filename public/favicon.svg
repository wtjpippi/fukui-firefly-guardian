<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- 暗い緑の背景円 -->
  <circle cx="50" cy="50" r="45" fill="#0f2614" stroke="#c8e64e" stroke-width="3" />
  
  <!-- ほたるの光のグラデーション -->
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="35%" stop-color="#d4f06a" />
      <stop offset="70%" stop-color="#c8e64e" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#c8e64e" stop-opacity="0" />
    </radialGradient>
  </defs>
  
  <!-- 発光エフェクト -->
  <circle cx="50" cy="55" r="32" fill="url(#glow)" />
  
  <!-- ほたるのイラスト -->
  <!-- 触角 -->
  <path d="M46 36 Q42 30, 37 32" stroke="#1e293b" stroke-width="2" fill="none" stroke-linecap="round" />
  <path d="M54 36 Q58 30, 63 32" stroke="#1e293b" stroke-width="2" fill="none" stroke-linecap="round" />
  
  <!-- 頭部 -->
  <circle cx="50" cy="39" r="5" fill="#1e293b" />
  
  <!-- 胴体 (前胸・腹部) -->
  <rect x="46" y="43" width="8" height="18" rx="4" fill="#1e293b" />
  
  <!-- お尻 (発光部) -->
  <rect x="46" y="56" width="8" height="10" rx="4" fill="#c8e64e" />
  
  <!-- 羽 (半透明) -->
  <path d="M48 45 C38 36, 32 46, 44 56 Z" fill="#e8f0e4" fill-opacity="0.85" />
  <path d="M52 45 C62 36, 68 46, 56 56 Z" fill="#e8f0e4" fill-opacity="0.85" />
</svg>